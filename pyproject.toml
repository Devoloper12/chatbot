[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-terminal-chatbot"
version = "2.0.0"
description = "Cross-platform terminal AI chatbot and CS tutor powered by Google Gemini"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "groq>=0.11.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "colorama>=0.4.6",
]

[project.scripts]
chatbot = "chatbot:main"
