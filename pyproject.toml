[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-terminal-chatbot"
version = "2.2.0"
description = "Minimalist terminal AI chatbot with conversation memory"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "groq>=0.11.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
chatbot = "chatbot:main"
